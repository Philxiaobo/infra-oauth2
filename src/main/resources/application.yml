spring:
  application:
    name: infra-oauth2
  config:
    import:
      - optional:configtree:/etc/infra/config/
      - optional:configtree:/etc/infra/secrets/
  main:
    web-application-type: servlet

server:
  port: 9000
  undertow:
    threads:
      io: 4
      worker: 32

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

infra:
  oauth2:
    issuer: ${INFRA_OAUTH2_ISSUER:http://localhost:9000}
  tracing:
    enabled: true
    baggage-fields:
      - userId
      - tenantId
      - requestId
  log:
    enabled: true
  cors:
    enabled: false
  xss:
    enabled: false
